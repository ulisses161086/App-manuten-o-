<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DiagMina - Diagnóstico Técnico</title>

  <!-- CONEXÃO COM O MANIFEST (PWA) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>

  <!-- REGISTRO DO SERVICE WORKER (OFFLINE) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registrado:', reg.scope))
          .catch((err) => console.log('Erro no Service Worker:', err));
      });
    }
  </script>
</head>
<body class="h-full flex flex-col justify-between font-sans antialiased bg-slate-950">

  <!-- TOP HEADER -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="bg-amber-500/20 text-amber-400 p-2 rounded-xl">
        🔧
      </div>
      <div>
        <h1 class="font-bold text-base text-slate-100 leading-tight">DiagMina AI</h1>
        <p class="text-xs text-slate-400 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> NotebookLM Conectado
        </p>
      </div>
    </div>
    <button onclick="limparCampos()" class="text-slate-400 hover:text-slate-200 text-xs flex items-center gap-1 bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700">
      🔄 Limpar
    </button>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 overflow-y-auto p-4 pb-24 space-y-4">

    <!-- ABA 1: CONSULTA DE DIAGNÓSTICO -->
    <section id="aba-diagnostico" class="space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-4">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2 border-b border-slate-800 pb-2">
          🔍 Consulta de Falha em Campo
        </h2>

        <!-- TAG do Equipamento -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">TAG / Frota do Equipamento</label>
          <input type="text" id="diag-tag" placeholder="Ex: CA-1043, PF-4702..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 uppercase tracking-wider">
        </div>

        <!-- Código de Erro -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Código de Erro / Alarme (Opcional)</label>
          <input type="text" id="diag-codigo" placeholder="Ex: FALHA MINE COMPASS, ERR-402..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 uppercase">
        </div>

        <!-- Sintoma com Botão de Voz -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-medium text-slate-400">Descrição da Falha / Sintoma</label>
            <button type="button" onclick="iniciarDitadoVoz('diag-sintoma')" class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20">
              🎙️ Ditar
            </button>
          </div>
          <textarea id="diag-sintoma" rows="3" placeholder="Ex: Falha no Mine Compass / Perda de trava GPS..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <!-- Botão Principal de Busca -->
        <button onclick="executarDiagnostico()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.98] transition text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-sm">
          ✨ Buscar Diagnóstico
        </button>
      </div>

      <!-- CARD DE RESULTADOS -->
      <div id="resultado-container" class="hidden space-y-3">
        <div class="bg-slate-900 border border-amber-500/30 rounded-2xl p-4 space-y-3 shadow-xl">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <span class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
              ⚙️ Diagnóstico Sugerido
            </span>
            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full">Alta Precisão</span>
          </div>

          <!-- Causas Prováveis -->
          <div>
            <h3 class="text-xs font-semibold text-slate-400 mb-1">Causas Raízes Prováveis:</h3>
            <ul id="res-causas" class="text-sm text-slate-200 space-y-1 list-disc list-inside bg-slate-950 p-2.5 rounded-xl border border-slate-800/80">
            </ul>
          </div>

          <!-- Passos de Teste -->
          <div>
            <h3 class="text-xs font-semibold text-slate-400 mb-1">Checklist de Inspeção em Campo:</h3>
            <div id="res-passos" class="space-y-1.5 text-xs text-slate-300">
            </div>
          </div>

          <!-- Histórico Similar -->
          <div class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-3 text-xs text-amber-200">
            <span class="font-bold flex items-center gap-1 text-amber-400 mb-1">
              📜 O.S. Similar Encontrada no Histórico:
            </span>
            <p id="res-historico" class="text-slate-300"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ABA 2: NOVO RELATÓRIO CORRETIVO -->
    <section id="aba-relatorio" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-3">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2 border-b border-slate-800 pb-2">
          📝 Registrar Nova Corretiva
        </h2>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">TAG Equipamento</label>
            <input type="text" id="rel-tag" placeholder="CA-1043" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-xs text-slate-100 uppercase">
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">Tempo Parado (Horas)</label>
            <input type="number" id="rel-tempo" placeholder="1.5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-xs text-slate-100">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Causa Raiz Constatada</label>
          <input type="text" id="rel-causa" placeholder="Ex: Antena GNSS desalinhada / cabo rompedor..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-xs text-slate-100">
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Ação Corretiva Executada</label>
          <textarea id="rel-acao" rows="2" placeholder="Descreva os reparos e trocas efetuadas..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100"></textarea>
        </div>

        <button onclick="gerarRelatorioTexto()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] transition text-white font-semibold py-2.5 px-4 rounded-xl shadow flex items-center justify-center gap-2 text-xs">
          📋 Copiar Texto Formatado para NotebookLM
        </button>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bg-slate-900/95 backdrop-blur border-t border-slate-800 fixed bottom-0 left-0 right-0 z-50 px-6 py-2">
    <div class="flex justify-around items-center max-w-md mx-auto">
      <button onclick="mudarAba('diagnostico')" id="btn-nav-diag" class="flex flex-col items-center gap-1 text-amber-400 transition">
        <span class="text-base">🔍</span>
        <span class="text-[10px] font-medium">Diagnóstico</span>
      </button>
      <button onclick="mudarAba('relatorio')" id="btn-nav-rel" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition">
        <span class="text-base">📝</span>
        <span class="text-[10px] font-medium">Relatório</span>
      </button>
      <a href="https://gemini.google.com/notebook/437a7e63-75e0-49cf-97fd-bb594e6417f8" target="_blank" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition">
        <span class="text-base">🔗</span>
        <span class="text-[10px] font-medium">Abrir Caderno</span>
      </a>
    </div>
  </nav>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    function mudarAba(aba) {
      const abaDiag = document.getElementById('aba-diagnostico');
      const abaRel = document.getElementById('aba-relatorio');
      const btnDiag = document.getElementById('btn-nav-diag');
      const btnRel = document.getElementById('btn-nav-rel');

      if (aba === 'diagnostico') {
        abaDiag.classList.remove('hidden');
        abaRel.classList.add('hidden');
        btnDiag.className = "flex flex-col items-center gap-1 text-amber-400 transition";
        btnRel.className = "flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition";
      } else {
        abaDiag.classList.add('hidden');
        abaRel.classList.remove('hidden');
        btnRel.className = "flex flex-col items-center gap-1 text-emerald-400 transition";
        btnDiag.className = "flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition";
      }
    }

    function iniciarDitadoVoz(elementId) {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.interimResults = false;

        const targetInput = document.getElementById(elementId);
        targetInput.placeholder = "Escutando...";

        recognition.start();

        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript;
          targetInput.value += (targetInput.value ? ' ' : '') + transcript;
        };

        recognition.onerror = function() {
          alert('Não foi possível capturar a voz. Tente novamente.');
        };
      } else {
        alert('Ditado por voz não suportado neste navegador.');
      }
    }

    function executarDiagnostico() {
      const tag = document.getElementById('diag-tag').value;
      const sintoma = document.getElementById('diag-sintoma').value;
      const codigo = document.getElementById('diag-codigo').value;

      if (!sintoma && !codigo) {
        alert('Por favor, informe o código do erro ou a descrição do sintoma.');
        return;
      }

      const resContainer = document.getElementById('resultado-container');
      const resCausas = document.getElementById('res-causas');
      const resPassos = document.getElementById('res-passos');
      const resHistorico = document.getElementById('res-historico');

      // Personaliza resposta se for relacionado ao Mine Compass / GPS
      const termoBusca = (codigo + ' ' + sintoma).toUpperCase();

      if (termoBusca.includes('MINE COMPASS') || termoBusca.includes('COMPASS') || termoBusca.includes('GPS')) {
        resCausas.innerHTML = `
          <li>Perda de sincronismo ou travamento do receptor GPS/GNSS.</li>
          <li>Desalinhamento/folga mecânica no suporte do sensor de orientação/bússola.</li>
          <li>Avaria no cabo coaxial/sinal da antena de alta precisão.</li>
          <li>Falha de comunicação na rede mesh (Módulo Rajant / Rádio).</li>
        `;

        resPassos.innerHTML = `
          <label class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
            <input type="checkbox" class="accent-amber-500 rounded">
            <span>1. Reiniciar a alimentação (Power Cycle) do módulo Mine Compass / Dispatch.</span>
          </label>
          <label class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
            <input type="checkbox" class="accent-amber-500 rounded">
            <span>2. Verificar conexões dos cabos RF da antena GPS e aperto dos conectores TNC/N.</span>
          </label>
          <label class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
            <input type="checkbox" class="accent-amber-500 rounded">
            <span>3. Validar se a quantidade de satélites no status GNSS é superior a 12.</span>
          </label>
          <label class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
            <input type="checkbox" class="accent-amber-500 rounded">
            <span>4. Testar link de rádio mesh (LEDs de Link no Rajant).</span>
          </label>
        `;

        resHistorico.innerText = `O.S. 2108 (${tag || 'CA-1043'}): Perda de sinal Mine Compass resolvida após reaperto do suporte da antena GNSS e reinicialização do switch de rede.`;
      } else {
        resCausas.innerHTML = `
          <li>Oxidação ou mau contato nos conectores de sinal da ECU.</li>
          <li>Falha de alimentação elétrica ou subtensão na linha 24V.</li>
          <li>Anomalia no sensor de entrada do módulo principal.</li>
        `;

        resPassos.innerHTML = `
          <label class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
            <input type="checkbox" class="accent-amber-500 rounded">
            <span>1. Inspecionar chicote e conectores com limpa-contato.</span>
          </label>
          <label class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
            <input type="checkbox" class="accent-amber-500 rounded">
            <span>2. Testar tensão de alimentação nos fusíveis do sistema de bordo.</span>
          </label>
        `;

        resHistorico.innerText = `O.S. Registrada (${tag || 'EQUIPAMENTO'}): Falha genérica registrada. Verifique conexões elétricas principais.`;
      }

      resContainer.classList.remove('hidden');
      resContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function gerarRelatorioTexto() {
      const tag = document.getElementById('rel-tag').value || 'N/A';
      const tempo = document.getElementById('rel-tempo').value || '0';
      const causa = document.getElementById('rel-causa').value || 'Não informada';
      const acao = document.getElementById('rel-acao').value || 'Não informada';

      const textoFormatado = `RELATÓRIO DE MANUTENÇÃO CORRETIVA\nTAG: ${tag.toUpperCase()}\nTEMPO PARADO: ${tempo}h\nCAUSA RAIZ: ${causa}\nAÇÃO EXECUTADA: ${acao}`;

      navigator.clipboard.writeText(textoFormatado).then(() => {
        alert('Relatório copiado com sucesso! Pode colar no NotebookLM.');
      });
    }

    function limparCampos() {
      document.getElementById('diag-tag').value = '';
      document.getElementById('diag-codigo').value = '';
      document.getElementById('diag-sintoma').value = '';
      document.getElementById('resultado-container').classList.add('hidden');
    }
  </script>
</body>
</html>
